[slice]
id = "dec_1"
subgraph = "sg_decoder"
core = "audio-decoder"
instance = 1
scope = "decoder_layers[3:6] + lm_head"

[io.in.enc_states]
dtype = "f32"
shape = [1, 1500, 512]
sharedmem_region = "enc_states"

[io.in.dec_act_mid]
dtype = "f32"
shape = [1, 1, 512]
sharedmem_region = "dec_act_mid"

[io.out]
name = "logits"
dtype = "f32"
shape = [1, 1, 51865]

[policy]
mismatch = "error"
note = "Last-step logits only. Full [1,448,vocab] from reference importer is not the hardware contract."
