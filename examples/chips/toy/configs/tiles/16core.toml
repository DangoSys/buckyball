# Toy Tile Configuration (16 cores, shared tile-private L2)

[privateDCache]
enable = false
ways = 4
capacityKB = 256
writeBytes = 8
portFactor = 2
memCycles = 10

[sharedMem]
enable = false
entries = 16384
inputChannels = 16
defaultGroupCount = 1

[coreTemplate]
include = "cores/demo.toml"
count = 16
