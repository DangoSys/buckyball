[package]
name = "bemu-toy"
version = "0.1.0"
edition = "2021"
build = "../../../../bebop/src/nodes/bemu/build.rs"

[lib]
name = "bebop_bemu"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "bebop"
path = "../../../../bebop/src/main.rs"

[[test]]
name = "test_bemu"
path = "../../../../bebop/tests/test_bemu.rs"
harness = false

[dependencies]
snafu = "0.8"
once_cell = "1"
toml = "0.8"
bebop-dasm = { path = "../../../../bebop/src/nodes/lib/dasm" }
bebop-bank-hash = { path = "../../../../bebop/src/nodes/lib/bank-hash" }
bebop-fd-redirect = { path = "../../../../bebop/src/nodes/lib/fd-redirect" }
bebop-rtl-trace = { path = "../../../../bebop/src/nodes/lib/rtl-trace" }
bebop-uart = { path = "../../../../bebop/src/nodes/lib/uart" }
bebop-dtb = { path = "../../../../bebop/src/nodes/lib/dtb" }
bebop-elf = { path = "../../../../bebop/src/nodes/lib/elf" }
bebop-syscall = { path = "../../../../bebop/src/nodes/lib/syscall" }
bebop-verilator = { path = "../../../../bebop/src/nodes/verilator", optional = true }
bebop-p2e = { path = "../../../../bebop/src/nodes/p2e", optional = true }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["fs", "mman", "signal", "process"] }
ctrlc = "3"
camino = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duct = "0.13"

[features]
default = ["bemu"]
bemu = []
verilator = ["dep:bebop-verilator"]
p2e = ["dep:bebop-p2e"]

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
toml = "0.8"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
libtest-mimic = "0.8"
assert_cmd = "2"
walkdir = "2"
predicates = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
