# DiffTest workload set. TLB tests remain in workloads-elf.toml for RTL-only
# regression because BEMU does not model the Buckyball DMA/NPU TLB.
[workloads]
search_path = "workloads/src"
tests = [
  "toy-toy-ctest-mvin_mvout_test-baremetal",
  "toy-toy-ctest-bdb_counter_test-baremetal",
  "toy-toy-ctest-gemmini_os_cisc_basic_test-baremetal",
  "toy-toy-ctest-gemmini_os_cisc_atranspose_test-baremetal",
  "toy-toy-ctest-gemmini_os_cisc_btranspose_test-baremetal",
  "toy-toy-ctest-gemmini_os_cisc_shift_test-baremetal",
  "toy-toy-ctest-gemmini_ws_cisc_conv_test-baremetal",
  "toy-toy-ctest-mmio_minimal_test-baremetal",
  "toy-toy-ctest-mxfp2int_test-baremetal",
  "toy-toy-ctest-mvin_mvout_stride_test-baremetal",
]
