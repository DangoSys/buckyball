# DiffTest workload set. TLB tests remain in workloads-elf.toml for RTL-only
# regression because BEMU does not model the Buckyball DMA/NPU TLB.
[workloads]
search_path = "workloads/src"
tests = [
  "toy_ctest_mvin_mvout_test-baremetal",
  "toy_ctest_bdb_counter_test-baremetal",
  "toy_ctest_gemmini_os_cisc_basic_test-baremetal",
  "toy_ctest_gemmini_os_cisc_atranspose_test-baremetal",
  "toy_ctest_gemmini_os_cisc_btranspose_test-baremetal",
  "toy_ctest_gemmini_os_cisc_shift_test-baremetal",
  "toy_ctest_gemmini_ws_cisc_conv_test-baremetal",
  "toy_ctest_mmio_minimal_test-baremetal",
  "toy_ctest_mxfp2int_test-baremetal",
  "toy_ctest_mvin_mvout_stride_test-baremetal",
]
