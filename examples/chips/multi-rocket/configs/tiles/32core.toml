# multi-rocket Tile (32 Rocket-only cores)

[privateDCache]
enable = true
ways = 4
capacityKB = 256
writeBytes = 8
portFactor = 2
memCycles = 10

[sharedMem]
enable = false
entries = 16384
inputChannels = 32
defaultGroupCount = 1
memCycles = 10

[coreTemplate]
include = "../../../../cores/rocket/core.toml"
count = 32
