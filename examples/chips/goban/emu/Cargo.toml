[package]
name = "bemu-goban"
version = "0.1.0"
edition = "2021"
build = "../../../../bebop/src/nodes/bemu/build.rs"

[lib]
name = "bebop_bemu"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "bebop"
path = "../../../../bebop/src/nodes/bemu/src/main.rs"

[[test]]
name = "test_bemu"
path = "../../../../bebop/tests/test_bemu.rs"
harness = false

[dependencies]
snafu = "0.8"
once_cell = "1"
toml = "0.8"
bebop-elf = { path = "../../../../bebop/src/nodes/lib/elf" }
bebop-syscall = { path = "../../../../bebop/src/nodes/lib/syscall" }
bebop-dtb = { path = "../../../../bebop/src/nodes/lib/dtb" }
bebop-uart = { path = "../../../../bebop/src/nodes/lib/uart" }
bebop-bank-hash = { path = "../../../../bebop/src/nodes/lib/bank-hash" }

[features]
default = ["bemu"]
bemu = []
verilator = []
p2e = []

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
toml = "0.8"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
libtest-mimic = "0.8"
assert_cmd = "2"
walkdir = "2"
predicates = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
