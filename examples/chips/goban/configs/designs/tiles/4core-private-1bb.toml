# Goban Tile (4 cores: core 0 has Buckyball, cores 1-3 are Rocket-only)

memBallChannelNum = 6

[privateDCache]
enable = true
ways = 4
capacityKB = 256
writeBytes = 8
portFactor = 2
memCycles = 10

[sharedMem]
enable = false
entries = 16384
inputChannels = 28
defaultGroupCount = 1
memCycles = 10

[[cores]]
core_id = 0
include = "../../../../../cores/goban/configs/default.toml"

[[cores]]
core_id = 1
include = "../../../../../cores/rocket/configs/default.toml"

[[cores]]
core_id = 2
include = "../../../../../cores/rocket/configs/default.toml"

[[cores]]
core_id = 3
include = "../../../../../cores/rocket/configs/default.toml"
