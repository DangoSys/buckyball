# The rocket hart: one RV64GC Rocket core, its caches and its Home, without
# an accelerator. Alone (--hart rocket) it runs on the framework's
# single-hart system.
component = "rocket"
implementation = "rocket.toml"
threads = []
hartId = 0
resetVector = 0x10000
mtimeAddress = 0x200bff8
memory = "memory/hart.toml"
fetch = "default"
fpu = "default"
interconnect = "interconnect/hart.toml"
service = false
controller = "default"

[param]
threadDataBytes = 64
xLen = 64
vaddrBits = 39
paddrBits = 36
pgIdxBits = 12
pgLevels = 3
nPMPs = 16

[sharedMem]
enable = false
entries = 16384
inputChannels = 1
defaultGroupCount = 1
virtualBankCount = 16
latency = 10
bankEntries = 1024
bankWidth = 128
