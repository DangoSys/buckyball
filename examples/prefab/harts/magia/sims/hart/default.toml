# The magia hart alone: the one instance of the single-hart system of this
# entry, the magia hart class with the placement and parameters the magia
# design gives it. Its uncached port has 6-bit AXI IDs and its regions reach
# 2 GiB of DDR, as the magia device's DDR.
include = "../../configs/default.toml"
implementation = "../../configs/magia.toml"
threads = []
hartId = 0
resetVector = 0x10000
mtimeAddress = 0x200bff8
memory = "../../configs/memory/hart.toml"
fetch = "default"
fpu = "../../configs/fpu.toml"
interconnect = "../../configs/interconnect/hart.toml"
service = false
controller = "default"

[param]
threadDataBytes = 64
xLen = 64
vaddrBits = 39
paddrBits = 36
pgIdxBits = 12
pgLevels = 3
nPMPs = 16

[sharedMem]
enable = false
entries = 16384
inputChannels = 1
defaultGroupCount = 1
virtualBankCount = 16
latency = 10
bankEntries = 1024
bankWidth = 128

[host.device.ddr]
idBits = 6
bytes = 0x80000000
