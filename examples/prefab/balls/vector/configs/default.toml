# Vector Ball Configuration

InputNum = 16
inputWidth = 8
lane = 16
outputWidth = 32
numMulThreads = 16
numCasThreads = 16

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 2, outBW = 4, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "VECMAT16", funct7 = 64 }]

# The BallDomain that holds this Ball alone (--ball vector).
[host]
include = "default"
