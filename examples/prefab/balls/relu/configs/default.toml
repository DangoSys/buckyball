# ReluBall has no implementation-specific parameters.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 1, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "RELU", funct7 = 50 }]

# The BallDomain that holds this Ball alone (--ball relu).
[host]
include = "default"
