# Im2col Ball Configuration
#
# Legal command range (enforced fail-hard in bemu/RTL):
#   iter    in 1 ..= maxIter
#   ksize   in 1 ..= maxKSize   # covers 1x1 / 3x3 / 5x5 / 7x7
#   stride  >= 1
#   padding   in 0 ..= maxPadding
#   start_row / start_col in 0 ..= padding   (asym pad: pad=max(lo,hi), start=pad-lo)
#   paddedSize = iter + 2*padding >= ksize + start
#   op1_bank != wr_bank
#   inputBase + iter*iter <= bankEntries
#   window_start + window_count <= outputDim * outputDim
#   K tiles = ksize * ksize * input groups, divisible by output groups
#   ceil(window_count / tile_rows) * tile_rows * K tiles / output groups <= bankEntries
#
# Input groups are 16-channel blocks; one bank row is one spatial position.

inputWidth = 8
# Resident Conv lowering can request a 4x4 output core from a stride-2,
# kernel-7 producer, which needs a 13x13 local input.
maxIter = 16
maxKSize = 7
maxPadding = 7
