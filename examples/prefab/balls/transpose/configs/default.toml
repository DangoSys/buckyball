# Transpose Ball Configuration

InputNum = 16
inputWidth = 8

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 1, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "TRANSPOSE", funct7 = 49 }]

# The BallDomain that holds this Ball alone (--ball transpose).
[host]
include = "default"
