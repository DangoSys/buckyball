# Int8AddBall has no private configuration.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 2, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [
  { mnemonic = "INT8ADD", funct7 = 69 },
  { mnemonic = "INT8ADD_RELU", funct7 = 70 },
]

# The BallDomain that holds this Ball alone (--ball int8add).
[host]
include = "default"
