# Int8MulBall has no private configuration.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 2, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "INT8MUL", funct7 = 71 }]

# The BallDomain that holds this Ball alone (--ball int8mul).
[host]
include = "default"
