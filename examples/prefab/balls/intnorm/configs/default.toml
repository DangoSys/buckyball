# Integer normalization has no private parameters.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 2, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "INTNORM", funct7 = 77 }]

# The BallDomain that holds this Ball alone (--ball intnorm).
[host]
include = "default"
