# Mxint8actBall has no private configuration parameters.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 2, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "MXINT8ACT", funct7 = 78 }]

# The BallDomain that holds this Ball alone (--ball mxint8act).
[host]
include = "default"
