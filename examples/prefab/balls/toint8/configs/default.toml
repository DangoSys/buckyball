# ToInt8Ball has no private configuration parameters.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 1, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [
  { mnemonic = "QUANT_F32_TO_I8", funct7 = 74 },
  { mnemonic = "QUANT_I32_TO_I8", funct7 = 67 },
]

# The BallDomain that holds this Ball alone (--ball toint8).
[host]
include = "default"
