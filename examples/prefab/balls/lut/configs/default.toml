# LutBall has no private configuration parameters.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 2, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "LUT", funct7 = 66 }]

# The BallDomain that holds this Ball alone (--ball lut).
[host]
include = "default"
