[tapeout]
top = "ThreadAlone"
sram_process = "smic180"
sram_mdf = "ip/smic180_sram_library.mdf.json"
constraints_sdc = "area/constraints.sdc"
target_library = "/home/bb-runner/Code/eda/D_libraries/SMIC180/SCC018UG_UHD_RVT_V0.4a/SCC018UG_UHD_RVT_V0p4a/liberty/1.8v/scc018ug_uhd_rvt_ss_v1p62_125c_ccs.db"
synthetic_library = [
  "/home/bb-runner/Code/eda/A_packages/tools/syn/R-2020.09-SP5/libraries/syn/dw_foundation.sldb",
  "/home/bb-runner/Code/eda/A_packages/tools/syn/R-2020.09-SP5/libraries/syn/standard.sldb",
]
link_library = []
max_threads = 8
# Power of a thread alone: the SAIF of a workload (--workload <name>) on
# its virtual environment, the thread's instance under the environment.
power_format = "saif"
power_sim_script = "power/power_sim.sh"
power_strip_path = "BBSimVcsHarness/dut/environment"
dc_script = "area/dc.tcl"
power_script = "../../../../../bbdev/api/steps/dc/scripts/ptpx.tcl"

sram_corner = "ss"
lc_shell = "/home/bb-runner/Code/eda/A_packages/tools/lc/R-2020.09-SP5/bin/lc_shell"


# SRAM macros the bank, queue and store memories map to (as for a Ball alone).
[[tapeout.sram]]
name = "chipyard_sram_32x128"
words = 32
mux = 4
bits = 128

[[tapeout.sram]]
name = "chipyard_sram_32x22"
words = 32
mux = 4
bits = 22

[[tapeout.sram]]
name = "chipyard_sram_64x21"
words = 64
mux = 8
bits = 21

[[tapeout.sram]]
name = "chipyard_sram_64x22"
words = 64
mux = 8
bits = 22

[[tapeout.sram]]
name = "chipyard_sram_512x8"
words = 512
mux = 8
bits = 8

[[tapeout.sram]]
name = "chipyard_sram_512x32"
words = 512
mux = 8
bits = 32

[[tapeout.sram]]
name = "chipyard_sram_512x64"
words = 512
mux = 8
bits = 64

[[tapeout.sram]]
name = "chipyard_sram_32x21"
words = 32
mux = 4
bits = 21

[[tapeout.sram]]
name = "chipyard_sram_32x23"
words = 32
mux = 4
bits = 23

[[tapeout.sram]]
name = "chipyard_sram_64x8"
words = 64
mux = 8
bits = 8

[[tapeout.sram]]
name = "chipyard_sram_64x128"
words = 64
# SMIC180 has only six metal layers, so this macro cannot be treated as a
# routable-over cell. mux=4 changes only the internal column organization:
# it keeps the 64x128 1RW + BWEN interface but shrinks the generated macro
# width from about 2013 um (mux=8) to about 1045 um, avoiding long routing walls.
mux = 4
bits = 128
bitwrite = true

[[tapeout.sram]]
name = "chipyard_sram_128x8"
words = 128
mux = 8
bits = 8

[[tapeout.sram]]
name = "chipyard_sram_256x32"
words = 256
mux = 8
bits = 32

[[tapeout.sram]]
name = "chipyard_sram_256x64"
words = 256
mux = 8
bits = 64
