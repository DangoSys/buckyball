# Poly Decode Core Memory Domain Configuration
# Private (per-core) memory parameters. Shared memory lives in the tile TOML.
# Token-at-a-time decode favors a smaller, lower-footprint private scratchpad.

[bank]
num = 8
width = 128
entries = 512
maskLen = 16
channel = 7

[dma]
nXacts = 8
burstMaxBytes = 1024
busWidth = 128
maxInFlightMemReqs = 16

[tlb]
size = 4

[tma]
readChannel = 4
writeChannel = 4

[mmio]
enable = false
bankNum = 16
bankEntries = 64
bankWidth = 128
readWidth = 8

[mem]
addrLen = 39
