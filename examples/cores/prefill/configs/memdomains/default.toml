# Poly Prefill Core Memory Domain Configuration
# Private (per-core) memory parameters. Shared memory lives in the tile TOML.
# Long prompt batches need more resident activation and weight tiles.

[bank]
num = 32
width = 128
entries = 2048
maskLen = 16
channel = 7

[dma]
nXacts = 8
burstMaxBytes = 1024
busWidth = 128
maxInFlightMemReqs = 16

[tlb]
size = 4

[tma]
readChannel = 4
writeChannel = 4

[mmio]
enable = false
bankNum = 16
bankEntries = 64
bankWidth = 128
readWidth = 8

[mem]
addrLen = 39
