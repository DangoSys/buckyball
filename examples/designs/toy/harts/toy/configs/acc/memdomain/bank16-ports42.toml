# Toy ACC memory domain for the interconnect area experiment: 16 banks, 42 request ports (one per Ball port).
# Private (per-thread) memory parameters. Shared memory lives in the hart TOML.

addrLen = 39

[bank]
layoutEnable = true
num = 16
width = 128
entries = 1024
maskLen = 16
requestPorts = 42

[dma]
busWidth = 128

[mmio]
# No Ball of the experiment has MMIO ports.
enable = false
bankNum = 16
bankEntries = 64
bankWidth = 8
readWidth = 8
