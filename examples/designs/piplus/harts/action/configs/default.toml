# The action hart: one hart running its four action threads; 256 KiB SharedMem.
component = "action"
resetVector = 0x10000
mtimeAddress = 0x200bff8
memory = "memory/hart.toml"
fetch = "default"
fpu = "default"
interconnect = "interconnect.toml"
service = false
controller = "controller.toml"
tbus = "tbus.toml"

[param]
threadDataBytes = 64
xLen = 64
vaddrBits = 39
paddrBits = 36
pgIdxBits = 12
pgLevels = 3
nPMPs = 16

[sharedMem]
enable = true
entries = 16384
inputChannels = 4
defaultGroupCount = 1
virtualBankCount = 40
latency = 10
bankEntries = 2048
bankWidth = 128

[tss]
base = 0x20000
bytes = 0x4000
dataBits = 128

[[threads]]
id = 0
name = "action0"
component = "action"
include = "../../../threads/action/configs/default.toml"

[[threads]]
id = 1
name = "action1"
component = "action"
include = "../../../threads/action/configs/default.toml"

[[threads]]
id = 2
name = "action2"
component = "action"
include = "../../../threads/action/configs/default.toml"

[[threads]]
id = 3
name = "action3"
component = "action"
include = "../../../threads/action/configs/default.toml"
