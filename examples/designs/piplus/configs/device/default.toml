# The piplus device, v1 at ~10x the area of the first sketch: one control
# core, eight dense cores and five action cores. Classes and counts are this
# list; each instance takes its hart and its coherence node IDs
# (1..memory/home/core.toml agents) here.
ddr = "ddr.toml"
bootrom = "default"
clint = "clint.toml"
plic = "plic.toml"
scu = "default"
trace = "default"

# core0: runtime, tokenization, Euler update and scheduling.
[[cores]]
include = "core/control/default.toml"
hartId = 0

[cores.memory.icache]
include = "memory/cache.toml"
nodeId = 1

[cores.memory.dcache.cache]
include = "memory/cache.toml"
nodeId = 2

