diffTest = false
verilatorThreads = 32

[memory]
lineBytes = 64
clockHz = 1000000000

[targets.device]
config = "examples.designs.piplus.devices.piplus.sims.device.DeviceConfig"

# The control hart alone (harts/control/sims/hart).
[targets.hart.control]
config = "examples.designs.piplus.harts.control.sims.hart.HartConfig"

# The solo hart and its accelerator alone (harts/solo/sims/hart), with
# PiplusSoloConfig: the device has no solo hart.
[targets.hart.solo]
config = "examples.designs.piplus.harts.solo.sims.hart.HartConfig"

# The action hart and its threads alone (harts/action/sims/hart).
[targets.hart.action]
config = "examples.designs.piplus.harts.action.sims.hart.HartConfig"

# A dense hart and its twelve threads alone (harts/dense/sims/hart).
[targets.hart.dense]
config = "examples.designs.piplus.harts.dense.sims.hart.HartConfig"

[verification]
registry = "../../sims/ip/uvm/registry.toml"
