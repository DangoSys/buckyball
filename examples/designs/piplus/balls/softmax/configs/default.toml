# The softmax of FP32 rows: no parameters.

# The Ball's interface: what every host wires.
[ball]
port = { inBW = 1, outBW = 1, mmioReadBW = 0, mmioWriteBW = 0 }
instructions = [{ mnemonic = "SOFTMAX", funct7 = 49 }]

# The BallDomain that holds this Ball alone (--ball piplus/balls/softmax).
[host]
include = "default"
