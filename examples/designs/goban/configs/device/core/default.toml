component = "goban"
implementation = "rocket.toml"
resetVector = 0x10000
mtimeAddress = 0x200bff8
memory = "memory/goban.toml"
dmaCache = "memory/dma-cache/shared.toml"
tbus = "tbus/default.toml"
fetch = "default"
fpu = "default"
interconnect = "interconnect/goban.toml"
c2c = "c2c/goban.toml"
controller = "controller/goban.toml"

[param]
