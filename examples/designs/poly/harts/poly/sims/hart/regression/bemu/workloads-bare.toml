# The bare-metal regression of the poly hart alone: its self-checking programs
# (exit code 0 = pass) and the SoC tests of the single-hart system. The
# multicore programs need the poly device's other harts; the transpose and
# intsoftmax Ball tests exit 1 on BEMU and are not in the poly device's
# regression either.
[workloads]
tests = [
  "poly-hart0-ctest-bank_paths-baremetal",
  "poly-hart0-ctest-dma_partial-baremetal",
  "poly-hart0-ctest-kernel_empty-baremetal",
  "poly-hart0-soctest-clint_software_interrupt-baremetal",
  "poly-hart0-soctest-clint_supervisor_timer-baremetal",
  "poly-hart0-soctest-clint_timer_interrupt-baremetal",
  "poly-hart0-soctest-lrsc_word-baremetal",
  "poly-hart0-soctest-plic_register_access-baremetal",
  "poly-hart0-soctest-time_csr_clock-baremetal",
  "poly-hart0-soctest-time_csr_permissions-baremetal",
  "poly-hart0-soctest-trace_events-baremetal",
  "poly-hart0-thread0-ctest-mm_accumulate_test-baremetal",
  "poly-hart0-thread0-ctest-mm_extremes_test-baremetal",
  "poly-hart0-thread0-ctest-mm_long_test-baremetal",
  "poly-hart0-thread0-ctest-mm_small_test-baremetal",
  "poly-hart0-thread0-ctest-mxint8act-baremetal",
  "poly-hart0-thread0-ctest-mxint8act_rows-baremetal",
  "poly-hart0-thread0-ctest-quant_edges_test-baremetal",
  "poly-hart0-thread0-ctest-quant_random_test-baremetal",
  "poly-hart0-thread1-ctest-mm_accumulate_test-baremetal",
  "poly-hart0-thread1-ctest-mm_extremes_test-baremetal",
  "poly-hart0-thread1-ctest-mm_long_test-baremetal",
