  "poly-hart0-thread3-ctest-mm_accumulate_test-baremetal",
  "poly-hart0-thread3-ctest-mm_extremes_test-baremetal",
  "poly-hart0-thread3-ctest-mm_long_test-baremetal",
  "poly-hart0-thread3-ctest-mm_small_test-baremetal",
  "poly-hart0-thread3-ctest-mxint8act-baremetal",
  "poly-hart0-thread3-ctest-mxint8act_rows-baremetal",
  "poly-hart0-thread3-ctest-quant_edges_test-baremetal",
