  "poly-hart0-thread1-ctest-quant_random_test-baremetal",
  "poly-hart0-thread2-ctest-mm_accumulate_test-baremetal",
  "poly-hart0-thread2-ctest-mm_extremes_test-baremetal",
  "poly-hart0-thread2-ctest-mm_long_test-baremetal",
