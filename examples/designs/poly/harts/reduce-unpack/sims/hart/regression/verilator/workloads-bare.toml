# The bare-metal regression of the poly reduce-unpack hart alone: its self-checking programs
# (exit code 0 = pass) and the SoC tests of the single-hart system.
# On Verilator: only the tests of the device's Verilator regression and the SoC
# tests (the CPU reference loops of the others take hours of RTL).
[workloads]
tests = [
  "poly-hart0-ctest-dma_partial_rows_test-baremetal",
  "poly-hart0-ctest-dma_unaligned_stream-baremetal",
  "poly-hart0-ctest-f32add_groups-baremetal",
  "poly-hart0-ctest-f32add_pipeline-baremetal",
  "poly-hart0-ctest-intnorm_extreme-baremetal",
  "poly-hart0-ctest-intnorm_round-baremetal",
  "poly-hart0-ctest-mxint8unpack_extremes-baremetal",
  "poly-hart0-ctest-mxint8unpack_full_bank-baremetal",
  "poly-hart0-ctest-mxint8unpack_metadata_tail-baremetal",
  "poly-hart0-ctest-mxint8unpack_single-baremetal",
  "poly-hart0-ctest-mxint8unpack_unused_field-baremetal",
  "poly-hart0-ctest-quant_edges_test-baremetal",
  "poly-hart0-ctest-quant_random_test-baremetal",
  "poly-hart0-ctest-reduce_quant-baremetal",
  "poly-hart0-soctest-clint_software_interrupt-baremetal",
  "poly-hart0-soctest-clint_supervisor_timer-baremetal",
  "poly-hart0-soctest-clint_timer_interrupt-baremetal",
  "poly-hart0-soctest-lrsc_word-baremetal",
  "poly-hart0-soctest-plic_register_access-baremetal",
  "poly-hart0-soctest-time_csr_clock-baremetal",
  "poly-hart0-soctest-time_csr_permissions-baremetal",
  "poly-hart0-soctest-trace_events-baremetal",
  "poly-main-mlirtest-ball_mxint8quantize_random-baremetal",
  "poly-main-mlirtest-ball_mxint8unpack_single-baremetal",
  "poly-main-mlirtest-bank_mxint8unpack_blocks-baremetal",
]
