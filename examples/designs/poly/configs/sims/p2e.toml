# Deep banks keep a complete 4096-element MXINT8 row in place.
# Four banks per thread cover the three live banks of current kernels.

[[device.cores]]
include = "../device/cores/core0/default.toml"

[[device.cores]]
include = "../device/cores/core1/default.toml"
threads = [
  { include = "p2e-attention.toml", id = 0, name = "attention0", memdomain = { bank = { num = 4, entries = 4096 } } },
  { include = "p2e-attention.toml", id = 1, name = "attention1", memdomain = { bank = { num = 4, entries = 4096 } } },
  { include = "p2e-ffn.toml", id = 2, name = "ffn0", memdomain = { bank = { num = 4, entries = 4096 } } },
  { include = "p2e-ffn.toml", id = 3, name = "ffn1", memdomain = { bank = { num = 4, entries = 4096 } } },
  { include = "p2e-ffn.toml", id = 4, name = "ffn2", memdomain = { bank = { num = 4, entries = 4096 } } },
]

