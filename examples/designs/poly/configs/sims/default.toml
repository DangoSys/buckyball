diffTest = false

[memory]
lineBytes = 64
clockHz = 1000000000

[targets.device]
config = "examples.designs.poly.sims.device.DeviceConfig"
stack_name = "poly"
regression = "sims/device/regression"
kernel = "sims/device/workloads/kernel"

# Each device config overrides a few tables of the design config.
[targets.device.configs]
PolyVerilatorConfig = "verilator.toml"
PolyTapeoutConfig = "tapeout.toml"
PolyP2EConfig = "p2e.toml"

[verification]
registry = "../../sims/ip/uvm/registry.toml"
