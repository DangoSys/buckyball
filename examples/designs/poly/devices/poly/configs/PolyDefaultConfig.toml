include = "design.toml"
# PolyDefaultConfig: the full nine-hart design (nine CPUs, forty Ants, two 16KiB instruction banks per Mixed) that the models run on; BEMU, Verilator, P2E, VCS, DC and tapeout.

[[device.harts]]
include = "../../../harts/reduce-unpack/configs/default.toml"
hartId = 0
nodeId = 1

[[device.harts]]
include = "../../../harts/poly/configs/default.toml"
hartId = 1
nodeId = 2
memory = { icache = { include = "../../../harts/poly/configs/memory/icache/hart.toml", nodeId = 3 }, dcache = { cache = { include = "../../../harts/poly/configs/memory/cache.toml", nodeId = 4 } } }
threads = [
  { include = "../../../threads/mixed5/configs/attention.toml", id = 0, name = "attention0", cpu = "../../../threads/mixed5/configs/cpu32.toml", memdomain = { bank = { num = 16, entries = 1024 }, mmio = { bankEntries = 1024 } }, gpdomain = { iBufWords = 4096 } },
  { include = "../../../threads/mixed5/configs/attention.toml", id = 1, name = "attention1", cpu = "../../../threads/mixed5/configs/cpu32.toml", memdomain = { bank = { num = 16, entries = 1024 }, mmio = { bankEntries = 1024 } }, gpdomain = { iBufWords = 4096 } },
  { include = "../../../threads/ffn5/configs/ffn.toml", id = 2, name = "ffn0", memdomain = { bank = { num = 16, entries = 1024 }, mmio = { bankEntries = 1024 } }, gpdomain = { eLen = 64, iBufWords = 4096 } },
  { include = "../../../threads/ffn5/configs/ffn.toml", id = 3, name = "ffn1", memdomain = { bank = { num = 16, entries = 1024 }, mmio = { bankEntries = 1024 } }, gpdomain = { eLen = 64, iBufWords = 4096 } },
  { include = "../../../threads/ffn5/configs/ffn.toml", id = 4, name = "ffn2", memdomain = { bank = { num = 16, entries = 1024 }, mmio = { bankEntries = 1024 } }, gpdomain = { eLen = 64, iBufWords = 4096 } },
]

