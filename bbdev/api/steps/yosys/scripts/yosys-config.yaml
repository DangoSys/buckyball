# Yosys synthesis configuration
# Users can customize liberty library paths and synthesis options here

# Liberty (.lib) file path for ASIC area estimation
# If not specified, yosys will use generic gate-level statistics. A technology
# owner may set YOSYS_LIBERTY in the host environment.
liberty:

# Default top module name (override with --top on CLI)
top: DigitalTop

# OpenSTA timing analysis settings
# Clock period in nanoseconds (used for STA constraint)
# Default 10ns = 100MHz
clock_period: 10.0

# Clock port name in the design
clock_name: clock

# Power estimation reports dynamic power as Internal + Switching; leakage is
# retained in OpenSTA's raw report but not included in dynamic_power_report.txt.
# Supply a workload VCD through `bbdev yosys --synth --vcd <file>` for an
# activity-driven result.  Empty vcd uses the default toggle-rate estimate below.
vcd:
input_activity: 0.1
input_duty: 0.5
clock_activity: 1.0
clock_duty: 0.5
