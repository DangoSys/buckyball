// chip.proto is the Chip schema.
// Java: mill protoJava; Python: chip_pb2.py (generated by config install step3).
syntax = "proto3";

package buckyball.config;

option java_package = "buckyball.config";
option java_multiple_files = true;

message MillConfig {
  string verilator_config = 1;
  string p2e_config = 2;
}

message BankConfig {
  uint32 num = 1;
  uint32 width = 2;
  uint32 entries = 3;
  uint32 mask_len = 4;
  uint32 channel = 5;
}

message MmioConfig {
  bool enable = 1;
  uint32 bank_num = 2;
  uint32 bank_entries = 3;
  uint32 bank_width = 4;
  uint32 read_width = 5;
}

message DmaConfig {
  uint32 n_xacts = 1;
  uint32 burst_max_bytes = 2;
  uint32 bus_width = 3;
  uint32 max_in_flight_mem_reqs = 4;
}

message TlbConfig {
  uint32 size = 1;
}

message TmaConfig {
  uint32 read_channel = 1;
  uint32 write_channel = 2;
}

message MemAddrConfig {
  uint32 addr_len = 1;
}

message MemDomainConfig {
  BankConfig bank = 1;
  DmaConfig dma = 2;
  TlbConfig tlb = 3;
  TmaConfig tma = 4;
  MmioConfig mmio = 5;
  MemAddrConfig mem = 6;
  string source_path = 7;
}

message BallIdMapping {
  uint32 ball_id = 1;
  string ball_name = 2;
  string ball_class = 3;
  string ball_dir = 4;
  string config_path = 5;
  uint32 in_bw = 6;
  uint32 out_bw = 7;
  uint32 mmio_read_bw = 8;
  uint32 mmio_write_bw = 9;
}

message BallIsaEntry {
  string mnemonic = 1;
  uint32 funct7 = 2;
  uint32 bid = 3;
}

message BallDomain {
  uint32 ball_num = 1;
  repeated BallIdMapping mappings = 2;
  repeated BallIsaEntry isa = 3;
  string source_path = 4;
}

message RocketMulDivConfig {
  bool enable = 1;
  uint32 mul_unroll = 2;
  bool mul_early_out = 3;
  bool div_early_out = 4;
}

message RocketFpuConfig {
  bool enable = 1;
  uint32 min_f_len = 2;
  uint32 f_len = 3;
}

message RocketDCacheConfig {
  uint32 n_sets = 1;
  uint32 n_ways = 2;
  uint32 n_mshrs = 3;
}

message RocketICacheConfig {
  uint32 n_sets = 1;
  uint32 n_ways = 2;
}

message RocketBtbConfig {
  bool enable = 1;
  uint32 n_entries = 2;
  uint32 n_ras = 3;
}

message RocketCoreConfig {
  uint32 x_len = 1;
  uint32 pg_levels = 2;
  bool use_vm = 3;
  bool use_zba = 4;
  bool use_zbb = 5;
  bool use_zbs = 6;
  bool have_c_flush = 7;
  RocketMulDivConfig mul_div = 8;
  RocketFpuConfig fpu = 9;
  RocketDCacheConfig dcache = 10;
  RocketICacheConfig icache = 11;
  RocketBtbConfig btb = 12;
}

message FrontendConfig {
  uint32 rob_entries = 1;
  bool rs_out_of_order_response = 2;
  uint32 bank_id_len = 3;
  uint32 vbank_id_upper_bound = 4;
  uint32 shared_bank_id_base = 5;
  uint32 iter_len = 6;
  bool sub_rob_enable = 7;
  uint32 sub_rob_depth = 8;
  string source_path = 9;
}

message GpDomainConfig {
  uint32 lane_number = 1;
  uint32 chaining_size = 2;
  uint32 v_len = 3;
  uint32 d_len = 4;
  uint32 e_len = 5;
  uint32 lane_scale = 6;
  string source_path = 7;
}

message CoreParamConfig {
  uint32 core_data_bytes = 1;
  uint32 x_len = 2;
  uint32 vaddr_bits = 3;
  uint32 paddr_bits = 4;
  uint32 pg_idx_bits = 5;
  uint32 n_pmps = 6;
  string source_path = 7;
}

message CoreInstance {
  uint32 index = 1;
  string role = 2;
  string pkg = 3;
  string config_path = 4;
  BallDomain balldomain = 5;
  MemDomainConfig mem = 6;
  string balldomain_base_dir = 7;
  RocketCoreConfig rocket_core = 8;
  FrontendConfig frontend = 9;
  GpDomainConfig gp_domain = 10;
  CoreParamConfig core = 11;
}

message BemuBall {
  string ball_class = 1;
  string ball_dir = 2;
  string emu_lib = 3;
}

message BemuConfig {
  string chip_main = 1;
  uint32 tile_index = 2;
  repeated BemuBall balls = 3;
}

message SharedMemConfig {
  bool enable = 1;
  uint32 entries = 2;
  uint32 input_channels = 3;
  uint32 default_group_count = 4;
  uint32 virtual_bank_count = 5;
  uint32 mem_cycles = 6;
}

message PrivateDCacheConfig {
  bool enable = 1;
  uint32 ways = 2;
  uint32 capacity_kb = 3;
  uint32 write_bytes = 4;
  uint32 port_factor = 5;
  uint32 mem_cycles = 6;
}

message TilePlacement {
  string path = 1;
  uint32 virtual_bank_count = 2;
  repeated uint32 core_indices = 3;
  uint32 mem_ball_channel_num = 4;
  PrivateDCacheConfig private_dcache = 5;
  SharedMemConfig shared_mem = 6;
}

message WorkloadConfig {
  reserved 1;
  map<string, string> cmake_param = 2;
}

message CompilerProfile {
  string name = 1;
  string pkg = 2;
  string compiler = 3;
  uint32 bank_num = 4;
  uint32 bank_width = 5;
  uint32 bank_entries = 6;
  repeated string ball_ctest_dirs = 7;
}

message Chip {
  string name = 1;
  MillConfig mill = 2;
  string topology_path = 3;
  repeated string includes = 4;
  reserved 5;
  uint32 n_tiles = 6;
  repeated TilePlacement tiles = 7;
  repeated CoreInstance cores = 8;
  reserved 9;
  BemuConfig bemu = 10;
  WorkloadConfig workload = 11;
  string chip_path = 12;
  repeated CompilerProfile profiles = 13;
}
