// design.proto is the Design schema.
// Java: mill protoJava; Python: design_pb2.py (generated by config install step3).
syntax = "proto3";

package buckyball.config;

import "google/protobuf/any.proto";
import "hardware.proto";

option java_package = "buckyball.config";
option java_multiple_files = true;

message MillConfig {
  reserved 1, 2;
  map<string, MillTarget> targets = 3;
  map<string, string> tops = 4;
  map<string, string> resources = 5;
}

message BankConfig {
  uint32 num = 1;
  uint32 width = 2;
  uint32 entries = 3;
  uint32 mask_len = 4;
  uint32 request_ports = 5;
  optional bool layout_enable = 6;
}

message MmioConfig {
  bool enable = 1;
  uint32 bank_num = 2;
  uint32 bank_entries = 3;
  uint32 bank_width = 4;
  uint32 read_width = 5;
}

message DmaConfig {
  uint32 bus_width = 3;
}

message MemAddrConfig {
  uint32 addr_len = 1;
}

message MemDomainConfig {
  BankConfig bank = 1;
  DmaConfig dma = 2;
  MmioConfig mmio = 5;
  MemAddrConfig mem = 6;
  string source_path = 7;
}

message BallInstance {
  uint32 ball_id = 1;
  string ball_name = 2;
  string ball_dir = 3;
  uint32 in_bw = 4;
  uint32 out_bw = 5;
  uint32 mmio_read_bw = 6;
  uint32 mmio_write_bw = 7;
  repeated BallInstruction instructions = 8;
  google.protobuf.Any parameters = 9;
  string rtl_class = 10;
  reserved 11;
}

message BallInstruction {
  string mnemonic = 1;
  uint32 funct7 = 2;
}

message BallDomain {
  repeated BallInstance balls = 1;
}

message FrontendConfig {
  uint32 rob_entries = 1;
  bool rs_out_of_order_response = 2;
  uint32 bank_id_len = 3;
  uint32 vbank_id_upper_bound = 4;
  uint32 shared_bank_id_base = 5;
  uint32 iter_len = 6;
  bool sub_rob_enable = 7;
  uint32 sub_rob_depth = 8;
  string source_path = 9;
  optional bool bank_alias_enable = 10;
}

message GpDomainConfig {
  uint32 lane_number = 1;
  uint32 v_len = 2;
  uint32 e_len = 3;
  uint32 i_buf_words = 4;
  uint32 memory_ports = 5;
  string source_path = 6;
  optional bool enable = 7;
}

message CoreParamConfig {
  uint32 thread_data_bytes = 1;
  uint32 x_len = 2;
  uint32 vaddr_bits = 3;
  uint32 paddr_bits = 4;
  uint32 pg_idx_bits = 5;
  uint32 pg_levels = 6;
  uint32 n_pmps = 7;
}

message SpmConfig {
  uint64 base = 1;
  uint32 bytes = 2;
  uint32 data_bits = 3;
}

message AntConfig {
  uint32 code_bytes = 1;
  SpmConfig tls = 2;
  uint32 task_bits = 3;
}

message CpuConfig {
  string kind = 1;
  oneof cpu {
    AntConfig ant = 5;
  }
  string source_path = 4;
}

message ThreadInstance {
  uint32 index = 1;
  string role = 2;
  string pkg = 3;
  string config_path = 4;
  BallDomain balldomain = 5;
  MemDomainConfig mem = 6;
  string balldomain_base_dir = 7;
  CpuConfig cpu = 8;
  FrontendConfig frontend = 9;
  reserved 10;
  GpDomainConfig gpdomain = 11;
  reserved 12;
  TransportHardware transport = 13;
  optional uint32 local_id = 14;
  optional uint64 signature = 15;
  string profile = 16;
  string source_path = 17;
  string rtl_class = 18;
}

message BemuBall {
  string ball_class = 1;
  string ball_dir = 2;
  string emu_lib = 3;
}

message BemuConfig {
  reserved 1, 2;
  repeated BemuBall balls = 3;
}

message SharedMemConfig {
  bool enable = 1;
  uint32 entries = 2;
  uint32 input_channels = 3;
  uint32 default_group_count = 4;
  uint32 virtual_bank_count = 5;
  uint32 mem_cycles = 6;
  uint32 bank_entries = 7;
  uint32 bank_width = 8;
}

message LocalAccelerator {
  BallDomain balldomain = 1;
  MemDomainConfig mem = 2;
  FrontendConfig frontend = 3;
  GpDomainConfig gpdomain = 4;
  TransportHardware transport = 5;
}

message CorePlacement {
  string path = 1;
  uint32 virtual_bank_count = 2;
  repeated uint32 thread_indices = 3;
  reserved 5;
  SharedMemConfig shared_mem = 6;
  CoreParamConfig param = 7;
  reserved 8;
  reserved 9;
  SpmConfig tss = 10;
  reserved 11;
  reserved 12;
  google.protobuf.Any implementation = 13;
  LocalAccelerator accelerator = 14;
  string profile = 16;
  reserved 17;
  uint32 hart_id = 18;
  uint64 reset_vector = 19;
  uint64 mtime_address = 20;
  MemoryConfig memory = 21;
  FetchConfig fetch = 22;
  FpuConfig fpu = 23;
  InterconnectConfig interconnect = 24;
  C2CConfig c2c = 25;
  TBusConfig tbus = 26;
  ControllerConfig controller = 27;
  RnfHardware dma_cache = 28;
  string component = 29;
  // Identity of the core hardware and its threads; runtime jobs select cores by it.
  uint64 signature = 30;

}

message WorkloadConfig {
  reserved 1;
  map<string, string> cmake_param = 2;
  optional uint32 control_hart = 3;
  optional uint32 report_hart = 4;
}

message CompilerProfile {
  string name = 1;
  string pkg = 2;
  string compiler = 3;
  uint32 bank_num = 4;
  uint32 bank_width = 5;
  uint32 bank_entries = 6;
  repeated string ball_ctest_dirs = 7;
  ThreadInstance config = 8;
  optional uint32 test_core = 9;
}

message Design {
  string name = 1;
  MillConfig mill = 2;
  repeated string includes = 4;
  reserved 5;
  uint32 n_cores = 6;
  reserved 7;
  repeated ThreadInstance threads = 8;
  reserved 9;
  BemuConfig bemu = 10;
  WorkloadConfig workload = 11;
  string design_path = 12;
  repeated CompilerProfile profiles = 13;
  reserved 14;
  DeviceConfig device = 15;
  SimHardware sims = 16;
  VerificationConfig verification = 17;
  map<string, SimulationTarget> simulations = 18;
}

message SharedBankFabricConfig {
  optional uint32 owner_hart = 1;
  repeated uint32 participant_harts = 2;
  repeated uint32 bank_nodes = 3;
}

message DeviceConfig {
  repeated CorePlacement cores = 1;
  DdrHardware ddr = 2;
  BootRomHardware bootrom = 3;
  ClintHardware clint = 4;
  PlicHardware plic = 5;
  ScuHardware scu = 6;
  SharedBankFabricConfig shared_bank_fabric = 7;
}

message MillTarget {
  string directory = 1;
  string module = 2;
  string config = 3;
}
message VerificationConfig {
  repeated string balls = 1;
  repeated string ips = 2;
  reserved 3;
  repeated VerificationProfile profiles = 4;
}

message VerificationBuild {
  string kind = 1;
  string directory = 2;
  string module = 3;
  repeated string arguments = 4;
}

message VerificationReference {
  string manifest = 1;
  string library = 2;
}

message VerificationTest {
  string name = 1;
  string top = 2;
  string test = 3;
  string filelist = 4;
  uint64 timeout_ns = 5;
  uint32 wall_timeout_s = 6;
  string kind = 7;
  repeated string rtl_scopes = 8;
  repeated string metrics = 9;
  uint32 sink_ready = 10;
  uint32 sink_stall = 11;
  repeated string designs = 12;
  repeated string plusargs = 13;
  string assertion = 14;
  repeated string functional_groups = 15;
}

message VerificationProfile {
  string ip = 1;
  string profile = 2;
  string config_path = 3;
  string root = 4;
  string parameters_json = 5;
  map<string, string> defines = 6;
  VerificationBuild build = 7;
  VerificationReference model = 8;
  repeated VerificationTest tests = 9;
  string resources = 10;
  string scope = 11;
}

message SimulationTarget {
  string directory = 1;
  MillTarget arch = 2;
  string entry_class = 3;
  string top = 4;
  string emu = 5;
  string emu_package = 6;
  string stack = 7;
  string stack_name = 8;
  string workloads = 9;
  map<string, string> resources = 10;
}
