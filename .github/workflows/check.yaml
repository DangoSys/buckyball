name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: buckyball-ci-check
  cancel-in-progress: false

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: check
    steps:
      - name: Print information
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "branch=${{ github.head_ref }} -> ${{ github.base_ref }}"
          else
            echo "branch=${{ github.ref_name }}"
          fi

      - name: Prepare repo
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"

          # fetch first to ensure if we modify ci_repo_lock.sh, we still use the old version to checkout.
          git fetch --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            prepare "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

          nix build
          cd "${root}/bbdev"
          nix develop -c true
          cd "${root}/bebop"
          nix develop -c true

      - name: Check pre-commit
        shell: zsh {0}
        run: |
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          nix develop -c pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Install config
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          cd "${root}"
          nix develop -c bbdev config --install

  chip-check:
    name: ${{ matrix.chip }}
    needs: pre-commit
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: toy
            run_bemu_tests: true
            run_verilator_tests: true
          - chip: pebble
            run_bemu_tests: true
            run_verilator_tests: true
          - chip: goban
            run_bemu_tests: true
            run_verilator_tests: true
          - chip: poly
            run_bemu_tests: true
            run_verilator_tests: true
          - chip: multi-rocket
            run_bemu_tests: true
            run_verilator_tests: true
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Print information
        run: |
          echo "chip=${{ matrix.chip }}"
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"

      - name: Enter repo lock
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Nix build
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix build

      - name: Build compiler and workloads
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev compiler --build '--chip ${{ matrix.chip }}'
          nix develop -c bbdev workload --clean '--chip ${{ matrix.chip }}'
          nix develop -c bbdev workload --build '--chip ${{ matrix.chip }}'

      - name: bemu tests
        if: matrix.run_bemu_tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev bebop-bemu --batch '--chip ${{ matrix.chip }} --test bare-tests --jobs 16 --clean-before'
          nix develop -c bbdev kernel --build '--chip ${{ matrix.chip }}'
          nix develop -c bbdev bebop-bemu --batch '--chip ${{ matrix.chip }} --test linux-tests --jobs 16'

      - name: verilator tests
        if: matrix.run_verilator_tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev bebop-verilator --clean '--chip ${{ matrix.chip }}'
          nix develop -c bbdev bebop-verilator --verilog '--chip ${{ matrix.chip }} --diff'
          nix develop -c bbdev bebop-verilator --build '--jobs 100 --chip ${{ matrix.chip }} --diff'
          nix develop -c bbdev bebop-verilator --batch '--chip ${{ matrix.chip }} --test bare-tests --diff --jobs 16 --clean-before'

      - name: Detect bebop JUnit files
        if: always() && (matrix.run_bemu_tests || matrix.run_verilator_tests)
        id: junit
        shell: zsh {0}
        run: |
          root="${BB_ROOT/#\~/$HOME}"
          files=("${root}/bebop/target/${{ matrix.chip }}/nextest/junit-bbdev-"*.xml(N))
          if (( ${#files} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bebop test report
        if: always() && (matrix.run_bemu_tests || matrix.run_verilator_tests) && steps.junit.outputs.found == 'true'
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "~/Code/buckyball/bebop/target/${{ matrix.chip }}/nextest/junit-bbdev-*.xml"
          check_name: "bebop nextest (${{ matrix.chip }})"
          detailed_summary: true
          include_passed: true

      - name: Upload bebop JUnit artifacts
        if: always() && (matrix.run_bemu_tests || matrix.run_verilator_tests) && steps.junit.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        env:
          ALL_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: github.com,api.github.com,uploads.github.com,objects.githubusercontent.com,.blob.core.windows.net
        with:
          name: bebop-nextest-junit-${{ matrix.chip }}
          path: "~/Code/buckyball/bebop/target/${{ matrix.chip }}/nextest/junit-bbdev-*.xml"

      - name: Exit repo lock
        if: always()
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
