name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: buckyball-ci-check
  cancel-in-progress: false

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: check
    steps:
      - name: Print information
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "branch=${{ github.head_ref }} -> ${{ github.base_ref }}"
          else
            echo "branch=${{ github.ref_name }}"
          fi

      - name: Prepare repo
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"

          # fetch first to ensure if we modify ci_repo_lock.sh, we still use the old version to checkout.
          git fetch --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            prepare "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

          nix build
          cd "${root}/bbdev"
          nix develop -c true
          cd "${root}/bebop"
          nix develop -c true

      - name: Check pre-commit
        shell: zsh {0}
        run: |
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          nix develop -c pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Install config
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          cd "${root}"
          nix develop -c bbdev config --install

  chip-check:
    name: ${{ matrix.chip }}
    needs: pre-commit
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: toy
            run_bemu_tests: true
            run_linux_tests: true
            run_verilator_tests: true
          - chip: pebble
            run_bemu_tests: true
            run_linux_tests: true
            run_verilator_tests: true
          - chip: goban
            run_bemu_tests: true
            run_linux_tests: false
            run_verilator_tests: true
          - chip: poly
            run_bemu_tests: true
            run_linux_tests: false
            run_verilator_tests: true
          - chip: multi-rocket
            run_bemu_tests: true
            run_linux_tests: true
            run_verilator_tests: true
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Print information
        run: |
          echo "chip=${{ matrix.chip }}"
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"

      - name: Enter repo lock
        id: repo_lock
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Nix build
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix build

      - name: Build compiler and workloads
        id: build
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev compiler --build '--chip ${{ matrix.chip }}'
          nix develop -c bbdev workload --clean '--chip ${{ matrix.chip }}'
          nix develop -c bbdev workload --build '--chip ${{ matrix.chip }}'
          rm -f "bebop/target/${{ matrix.chip }}/junit.xml"

      - name: bemu baremetal tests
        if: matrix.run_bemu_tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev bebop-bemu --batch '--chip ${{ matrix.chip }} --test bare-tests --jobs 16 --clean-before'

      - name: bemu Linux tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.run_linux_tests }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev kernel --build '--chip ${{ matrix.chip }}'
          nix develop -c bbdev bebop-bemu --batch '--chip ${{ matrix.chip }} --test linux-tests --jobs 16'

      - name: verilator tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.run_verilator_tests }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev bebop-verilator --clean '--chip ${{ matrix.chip }}'
          nix develop -c bbdev bebop-verilator --verilog '--chip ${{ matrix.chip }} --diff'
          nix develop -c bbdev bebop-verilator --build '--jobs 100 --chip ${{ matrix.chip }} --diff'
          nix develop -c bbdev bebop-verilator --batch '--chip ${{ matrix.chip }} --test bare-tests --diff --jobs 16'

      - name: Generate bebop JUnit report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: junit
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c python3 .github/scripts/bebop_junit.py \
            "bebop/target/${{ matrix.chip }}/test-artifacts" \
            "bebop/target/${{ matrix.chip }}/junit.xml"

      - name: Publish bebop test report
        if: ${{ !cancelled() && steps.junit.outcome == 'success' }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "~/Code/buckyball/bebop/target/${{ matrix.chip }}/junit.xml"
          check_name: "bebop (${{ matrix.chip }})"
          detailed_summary: true
          include_passed: true

      - name: Upload bebop test artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: bebop-tests-${{ matrix.chip }}
          path: |
            ~/Code/buckyball/bebop/target/${{ matrix.chip }}/junit.xml
            ~/Code/buckyball/bebop/target/${{ matrix.chip }}/test-artifacts/*/summary.json
            ~/Code/buckyball/bebop/target/${{ matrix.chip }}/test-artifacts/*/stdout.log
            ~/Code/buckyball/bebop/target/${{ matrix.chip }}/test-artifacts/*/stderr.log
          if-no-files-found: error

      - name: Exit repo lock
        if: ${{ always() && steps.repo_lock.outcome == 'success' }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
