name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: buckyball-ci-check
  cancel-in-progress: false

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: check
    steps:
      - name: Print information
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "branch=${{ github.head_ref }} -> ${{ github.base_ref }}"
          else
            echo "branch=${{ github.ref_name }}"
          fi

      - name: Prepare repo
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"

          # fetch first to ensure if we modify ci_repo_lock.sh, we still use the old version to checkout.
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            prepare "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

          nix build
          cd "${root}/bbdev"
          nix develop -c true
          cd "${root}/bebop"
          nix develop -c true

      - name: Check pre-commit
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          nix develop -c pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Install config
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          cd "${root}"
          nix develop -c bbdev config --install

  design-check:
    name: ${{ matrix.device }}
    needs: pre-commit
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        device:
          - toy
          - pebble
          - goban
          - poly
          - multi-rocket
          - gemmini
          - magia
          - piplus
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Print information
        run: |
          echo "device=${{ matrix.device }}"
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"

      - name: Enter repo lock
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Nix build
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix build

      - name: Build compiler and workloads
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev stack --build '--device ${{ matrix.device }}'
          nix develop -c bbdev workload --clean '--device ${{ matrix.device }}'
          nix develop -c bbdev workload --build '--device ${{ matrix.device }}'

      - name: bemu tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          # Other device jobs share this checkout; drop only this device's old batch runs.
          rm -rf "${root}"/log/*-${{ matrix.device }}-bebop-bemu-device-${{ matrix.device }}-*(N)
          nix develop -c bbdev bebop-bemu --batch "--device ${{ matrix.device }} --test bare-tests --jobs 16"
          nix develop -c bbdev image --build '--device ${{ matrix.device }}'
          nix develop -c bbdev bebop-bemu --batch "--device ${{ matrix.device }} --test linux-tests --jobs 16"

      - name: verilator tests
        # piplus's bare-tests take hours on Verilator; bbbench's verilator-workload covers them.
        if: matrix.device != 'piplus'
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          rm -rf "${root}"/log/*-${{ matrix.device }}-bebop-verilator-device-${{ matrix.device }}-*(N)
          nix develop -c bbdev bebop-verilator --clean '--device ${{ matrix.device }}'
          nix develop -c bbdev bebop-verilator --verilog '--device ${{ matrix.device }} --diff'
          nix develop -c bbdev bebop-verilator --build '--jobs 100 --device ${{ matrix.device }} --diff'
          nix develop -c bbdev bebop-verilator --batch "--device ${{ matrix.device }} --test bare-tests --diff --jobs 16"

      - name: Publish bebop test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "${{ env.BB_ROOT }}/log/*-${{ matrix.device }}-bebop-*-device-${{ matrix.device }}-*/junit.xml"
          check_name: "bebop tests (${{ matrix.device }})"
          detailed_summary: true
          include_passed: true

      - name: Upload bebop JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        # The runner host has no DNS of its own; uploads go through the proxy.
        env:
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
          NO_PROXY: localhost,127.0.0.1,::1
        with:
          name: bebop-junit-${{ matrix.device }}
          path: "${{ env.BB_ROOT }}/log/*-${{ matrix.device }}-bebop-*-device-${{ matrix.device }}-*/junit.xml"
          if-no-files-found: error

      - name: Exit repo lock
        if: always()
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
