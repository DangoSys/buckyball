name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: buckyball-ci-check
  cancel-in-progress: false

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: check
    steps:
      - name: Print information
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "branch=${{ github.head_ref }} -> ${{ github.base_ref }}"
          else
            echo "branch=${{ github.ref_name }}"
          fi

      - name: Prepare repo
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"

          # fetch first to ensure if we modify ci_repo_lock.sh, we still use the old version to checkout.
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            prepare "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

          nix build
          cd "${root}/bbdev"
          nix develop -c true
          cd "${root}/bebop"
          nix develop -c true

      - name: Check pre-commit
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          nix develop -c pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Install config
        shell: zsh {0}
        run: |
          set -euo pipefail
          root=~/Code/buckyball
          cd "${root}"
          nix develop -c bbdev config --install

  design-check:
    name: ${{ matrix.design }}
    needs: pre-commit
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: toy
            config: ToyVerilatorConfig
            run_bemu_tests: true
            run_verilator_tests: true
          - design: pebble
            config: PebbleVerilatorConfig
            run_bemu_tests: true
            run_verilator_tests: true
          - design: goban
            config: GobanVerilatorConfig
            run_bemu_tests: true
            run_verilator_tests: true
          - design: poly
            config: PolyVerilatorConfig
            run_bemu_tests: true
            run_verilator_tests: true
          - design: multi-rocket
            config: MultiRocketVerilatorConfig
            run_bemu_tests: true
            run_verilator_tests: true
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Print information
        run: |
          echo "design=${{ matrix.design }}"
          echo "event=${{ github.event_name }}"
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"

      - name: Enter repo lock
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Nix build
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix build

      - name: Build compiler and workloads
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev stack --build '--design ${{ matrix.design }} --device ${{ matrix.config }}'
          nix develop -c bbdev workload --clean '--design ${{ matrix.design }} --device ${{ matrix.config }}'
          nix develop -c bbdev workload --build '--design ${{ matrix.design }} --device ${{ matrix.config }}'

      - name: bemu tests
        if: matrix.run_bemu_tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          # Other design jobs share this checkout; drop only this config's old batch runs.
          rm -rf "${root}"/log/*-${{ matrix.design }}-bebop-bemu-device-${{ matrix.config }}-*(N)
          nix develop -c bbdev bebop-bemu --batch "--design ${{ matrix.design }} --device ${{ matrix.config }} --test bare-tests --jobs 16"
          nix develop -c bbdev kernel --build '--design ${{ matrix.design }} --device ${{ matrix.config }}'
          nix develop -c bbdev bebop-bemu --batch "--design ${{ matrix.design }} --device ${{ matrix.config }} --test linux-tests --jobs 16"

      - name: verilator tests
        if: matrix.run_verilator_tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          rm -rf "${root}"/log/*-${{ matrix.design }}-bebop-verilator-device-${{ matrix.config }}-*(N)
          nix develop -c bbdev bebop-verilator --clean '--design ${{ matrix.design }} --device ${{ matrix.config }}'
          nix develop -c bbdev bebop-verilator --verilog '--design ${{ matrix.design }} --device ${{ matrix.config }} --diff'
          nix develop -c bbdev bebop-verilator --build '--jobs 100 --design ${{ matrix.design }} --device ${{ matrix.config }} --diff'
          nix develop -c bbdev bebop-verilator --batch "--design ${{ matrix.design }} --device ${{ matrix.config }} --test bare-tests --diff --jobs 16"

      - name: Publish bebop test report
        if: always() && (matrix.run_bemu_tests || matrix.run_verilator_tests)
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "${{ env.BB_ROOT }}/log/*-${{ matrix.design }}-bebop-*-device-${{ matrix.config }}-*/junit.xml"
          check_name: "bebop regression (${{ matrix.design }})"
          detailed_summary: true
          include_passed: true

      - name: Upload bebop JUnit artifacts
        if: always() && (matrix.run_bemu_tests || matrix.run_verilator_tests)
        uses: actions/upload-artifact@v4
        # The runner host has no DNS of its own; uploads go through the proxy.
        env:
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
          NO_PROXY: localhost,127.0.0.1,::1
        with:
          name: bebop-junit-${{ matrix.design }}
          path: "${{ env.BB_ROOT }}/log/*-${{ matrix.design }}-bebop-*-device-${{ matrix.config }}-*/junit.xml"
          if-no-files-found: error

      - name: Exit repo lock
        if: always()
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
