name: regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write

concurrency:
  group: buckyball-regression-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  gate:
    name: run
    runs-on: check
    environment: regression
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Print information
        run: |
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "branch=${{ github.head_ref }} -> ${{ github.base_ref }}"
          else
            echo "branch=${{ github.ref_name }}"
          fi

      - name: Prepare repo
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            prepare "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
          nix build
          cd "${root}/bbdev"
          nix develop -c true
          cd "${root}/bebop"
          nix develop -c true

      - name: Install config
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev config --install

  eval-area-power:
    name: eval-area-power-${{ matrix.design }}
    needs: gate
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: toy
            config: ToyVerilatorConfig
            run_area: true
            run_power: false
          - design: pebble
            config: PebbleVerilatorConfig
            run_area: true
            run_power: false
          - design: goban
            config: GobanVerilatorConfig
            run_area: true
            run_power: false
          - design: poly
            config: PolyTapeoutConfig
            run_area: true
            run_power: false
          - design: multi-rocket
            config: MultiRocketVerilatorConfig
            run_area: true
            run_power: false
    env:
      BB_ROOT: ~/Code/buckyball
      SNPSLMD_LICENSE_FILE: 26000@127.0.0.1
    steps:
      - name: Enter repo lock
        if: matrix.run_area || matrix.run_power
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: DC area
        if: matrix.run_area
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          set +u
          source ~/.zshrc
          set -u
          nix develop -c bbdev dc --area '--design ${{ matrix.design }} --device ${{ matrix.config }}'

      - name: DC power
        if: matrix.run_power
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          set +u
          source ~/.zshrc
          set -u
          nix develop -c bbdev dc --power '--design ${{ matrix.design }} --device ${{ matrix.config }}'

      - name: Exit repo lock
        if: always() && (matrix.run_area || matrix.run_power)
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

  verification:
    name: verification-${{ matrix.design }}
    needs: gate
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: toy
            config: ToyVerilatorConfig
            run_uvm: true
          - design: pebble
            config: PebbleVerilatorConfig
            run_uvm: true
          - design: goban
            config: GobanVerilatorConfig
            run_uvm: true
          - design: poly
            config: PolyVerilatorConfig
            run_uvm: true
          - design: multi-rocket
            config: MultiRocketVerilatorConfig
            run_uvm: true
    env:
      BB_ROOT: ~/Code/buckyball
      SNPSLMD_LICENSE_FILE: 26000@127.0.0.1
    steps:
      - name: Enter repo lock
        if: matrix.run_uvm
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Design UVM
        if: matrix.run_uvm
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          set +u
          source ~/.zshrc
          set -u
          nix develop -c bbdev bebop-verilator --verilog '--design ${{ matrix.design }} --device ${{ matrix.config }}'
          nix develop -c bbdev uvm --run '--design ${{ matrix.design }} --device ${{ matrix.config }}'

      - name: Exit repo lock
        if: always() && matrix.run_uvm
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

  fpga-bitstream:
    name: fpga-bitstream-${{ matrix.design }}
    needs: gate
    runs-on: check
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: toy
            config: ToyVerilatorConfig
            build_bitstream: true
          - design: pebble
            config: PebbleVerilatorConfig
            build_bitstream: true
          - design: goban
            config: GobanVerilatorConfig
            build_bitstream: true
          - design: poly
            config: PolyP2EConfig
            build_bitstream: true
          - design: multi-rocket
            config: MultiRocketVerilatorConfig
            build_bitstream: true
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Enter repo lock
        if: matrix.build_bitstream
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: FPGA buildbitstream
        if: matrix.build_bitstream
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          for build_dir in "${root}"/bebop/build/"${{ matrix.design }}"-*(N); do
            rm -rf "${build_dir}"
          done
          nix develop -c bbdev bebop-p2e --verilog '--design ${{ matrix.design }} --device ${{ matrix.config }} --diff'
          nix develop -c bbdev bebop-p2e --buildbitstream '--design ${{ matrix.design }} --device ${{ matrix.config }} --diff'
          bits=("${root}"/bebop/build/"${{ matrix.design }}"-*/fpgaCompDir/bitstream.bit(N))
          if (( ${#bits} != 1 )); then
            echo "ERROR: expected exactly 1 bitstream.bit for ${{ matrix.design }}, got ${#bits}" >&2
            printf '%s\n' "${bits[@]}" >&2
            exit 1
          fi
          echo "bitstream=${bits[1]}"

      - name: Exit repo lock
        if: always() && matrix.build_bitstream
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

  fpga-check:
    name: fpga-check-${{ matrix.design }}
    needs: fpga-bitstream
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: toy
            config: ToyVerilatorConfig
            run_fpga_bare: true
            run_fpga_linux: true
          - design: pebble
            config: PebbleVerilatorConfig
            run_fpga_bare: true
            run_fpga_linux: true
          - design: goban
            config: GobanVerilatorConfig
            run_fpga_bare: true
            run_fpga_linux: false
          - design: poly
            config: PolyP2EConfig
            run_fpga_bare: true
            run_fpga_linux: false
          - design: multi-rocket
            config: MultiRocketVerilatorConfig
            run_fpga_bare: true
            run_fpga_linux: false
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Enter repo lock
        if: matrix.run_fpga_bare || matrix.run_fpga_linux
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: FPGA check
        if: matrix.run_fpga_bare || matrix.run_fpga_linux
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          bits=("${root}"/bebop/build/"${{ matrix.design }}"-*/fpgaCompDir/bitstream.bit(N))
          if (( ${#bits} != 1 )); then
            echo "ERROR: expected exactly 1 bitstream.bit for ${{ matrix.design }}, got ${#bits}" >&2
            printf '%s\n' "${bits[@]}" >&2
            exit 1
          fi

          if [[ "${{ matrix.run_fpga_bare }}" == "true" ]]; then
            nix develop -c bbdev stack --build "--design ${{ matrix.design }} --device ${{ matrix.config }}"
            nix develop -c bbdev workload --build "--design ${{ matrix.design }} --device ${{ matrix.config }}"
            nix develop -c bbdev workload --tohex "--design ${{ matrix.design }} --device ${{ matrix.config }}"
            nix develop -c bbdev bebop-p2e --batch "--design ${{ matrix.design }} --device ${{ matrix.config }} --bitstream ${bits[1]} --test bare-tests --diff"
          fi

          if [[ "${{ matrix.run_fpga_linux }}" == "true" ]]; then
            nix develop -c bbdev kernel --build "--design ${{ matrix.design }} --device ${{ matrix.config }}"
            nix develop -c bbdev bebop-p2e --batch "--design ${{ matrix.design }} --device ${{ matrix.config }} --bitstream ${bits[1]} --test linux-tests --diff"
          fi

      - name: Exit repo lock
        if: always() && (matrix.run_fpga_bare || matrix.run_fpga_linux)
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

  eval-performance:
    name: eval-performance-${{ matrix.design }}-${{ matrix.model }}
    needs: fpga-bitstream
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - design: pebble
            config: PebbleVerilatorConfig
            model: lenet
          - design: pebble
            config: PebbleVerilatorConfig
            model: mobilenet
          # - design: pebble
          #   config: PebbleVerilatorConfig
          #   model: resnet
          # - design: pebble
          #   config: PebbleVerilatorConfig
          #   model: yolo
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: Enter repo lock
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          cd "${root}"
          git fetch --no-recurse-submodules --force --prune origin "${CHECKOUT_SHA}"
          git show "${CHECKOUT_SHA}:.github/scripts/ci_repo_lock.sh" | bash -s -- \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Model build
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          if [ "${{ matrix.model }}" = "none" ]; then
            echo "ERROR: eval-performance requires a real model, got model=none" >&2
            exit 1
          fi
          nix develop -c bbdev stack --build "--design ${{ matrix.design }} --device ${{ matrix.config }}"
          nix develop -c bbdev workload --build "--design ${{ matrix.design }} --device ${{ matrix.config }} --model ${{ matrix.model }}"
          nix develop -c bbdev kernel --build "--design ${{ matrix.design }} --device ${{ matrix.config }} --model ${{ matrix.model }}"

      - name: Model performance
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          bits=("${root}"/bebop/build/"${{ matrix.design }}"-*/fpgaCompDir/bitstream.bit(N))
          if (( ${#bits} != 1 )); then
            echo "ERROR: expected exactly 1 bitstream.bit for ${{ matrix.design }}, got ${#bits}" >&2
            printf '%s\n' "${bits[@]}" >&2
            exit 1
          fi
          nix develop -c bbdev bebop-p2e --runworkload "--design ${{ matrix.design }} --device ${{ matrix.config }} --bitstream ${bits[1]} --model ${{ matrix.model }}"

      - name: Exit repo lock
        if: always()
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
