name: regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write

concurrency:
  group: buckyball-regression-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  gate:
    name: run
    runs-on: check
    environment: regression
    steps:
      - name: Print information
        run: |
          echo "sha=${CHECKOUT_SHA}"
          echo "ref=${CHECKOUT_REF}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "branch=${{ github.head_ref }} -> ${{ github.base_ref }}"
          else
            echo "branch=${{ github.ref_name }}"
          fi

      - name: Enter repo lock
        if: matrix.run_area || matrix.run_power
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          source "${root}/.github/scripts/setproxy.sh"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            prepare "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            enter "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

      - name: Install config
        if: matrix.run_area || matrix.run_power
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev config --install

  eval-area-power:
    name: eval-area-power-${{ matrix.chip }}
    needs: gate
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: toy
            run_area: false
            run_power: false
          - chip: pebble
            run_area: true
            run_power: false
          - chip: goban
            run_area: false
            run_power: false
          - chip: poly
            run_area: false
            run_power: false
          - chip: multi-rocket
            run_area: false
            run_power: false
    env:
      BB_ROOT: ~/Code/buckyball
      SNPSLMD_LICENSE_FILE: 26000@127.0.0.1
    steps:
      - name: DC area
        if: matrix.run_area
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          # nix develop -c bbdev regression --eval-area-power '--chip ${{ matrix.chip }}'
          nix develop -c bbdev dc --area '--chip ${{ matrix.chip }}'

      - name: DC power
        if: matrix.run_power
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev dc --power '--chip ${{ matrix.chip }}'

      - name: Exit repo lock
        if: always() && (matrix.run_area || matrix.run_power)
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"

  eval-performance:
    name: eval-performance-${{ matrix.chip }}-${{ matrix.model }}
    needs: gate
    runs-on: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: toy
            run_fpga_check: false
            run_model: false
            model: none
          - chip: pebble
            run_fpga_check: false
            run_model: true
            model: lenet
          - chip: pebble
            run_fpga_check: false
            run_model: true
            model: mobilenet
          - chip: pebble
            run_fpga_check: false
            run_model: true
            model: resnet
          - chip: pebble
            run_fpga_check: false
            run_model: true
            model: yolo
          - chip: goban
            run_fpga_check: false
            run_model: false
            model: none
          - chip: poly
            run_fpga_check: false
            run_model: false
            model: none
          - chip: multi-rocket
            run_fpga_check: false
            run_model: false
            model: none
    env:
      BB_ROOT: ~/Code/buckyball
    steps:
      - name: FPGA buildbitstream
        if: matrix.run_fpga_check || matrix.run_model
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          nix develop -c bbdev bebop-p2e --verilog '--chip ${{ matrix.chip }}'
          nix develop -c bbdev bebop-p2e --buildbitstream '--chip ${{ matrix.chip }}'

      - name: FPGA check
        if: matrix.run_fpga_check
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          bits=("${root}"/bebop/target/"${{ matrix.chip }}"/**/bitstream.bit(N))
          if (( ${#bits} != 1 )); then
            echo "ERROR: expected exactly 1 bitstream.bit for ${{ matrix.chip }}, got ${#bits}" >&2
            printf '%s\n' "${bits[@]}" >&2
            exit 1
          fi
          nix develop -c bbdev workload --build "--chip ${{ matrix.chip }}"
          nix develop -c bbdev workload --tohex "--chip ${{ matrix.chip }}"
          nix develop -c bbdev bebop-p2e --batch "--chip ${{ matrix.chip }} --bitstream ${bits[1]} --test elf-tests"
          nix develop -c bbdev bebop-p2e --batch "--chip ${{ matrix.chip }} --bitstream ${bits[1]} --test pk-tests"

      - name: Model Build
        if: matrix.run_model
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          if [ "${{ matrix.model }}" = "none" ]; then
            echo "ERROR: run_model=true requires a real model, got model=none" >&2
            exit 1
          fi

          nix develop -c bbdev workload --build "--chip ${{ matrix.chip }} --model ${{ matrix.model }}"
          nix develop -c bbdev kernel --build "--chip ${{ matrix.chip }} --model ${{ matrix.model }}"

      - name: Model performance
        if: matrix.run_model
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          cd "${root}"
          bits=("${root}"/bebop/target/"${{ matrix.chip }}"/**/bitstream.bit(N))
          if (( ${#bits} != 1 )); then
            echo "ERROR: expected exactly 1 bitstream.bit for ${{ matrix.chip }}, got ${#bits}" >&2
            printf '%s\n' "${bits[@]}" >&2
            exit 1
          fi

          nix develop -c bbdev bebop-p2e --runworkload "--chip ${{ matrix.chip }} --bitstream ${bits[1]} --model ${{ matrix.model }}"

      - name: Exit repo lock
        if: always() && (matrix.run_fpga_check || matrix.run_model)
        shell: zsh {0}
        run: |
          set -euo pipefail
          root="${BB_ROOT/#\~/$HOME}"
          bash "${root}/.github/scripts/ci_repo_lock.sh" \
            exit "${CHECKOUT_SHA}" "${root}" "${CHECKOUT_REF}"
