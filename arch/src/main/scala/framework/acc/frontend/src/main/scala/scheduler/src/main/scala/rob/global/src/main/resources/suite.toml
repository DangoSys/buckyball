[model]
manifest = ""
library = ""

[[tests]]
name = "rob"
top = "rob_tb"
test = "protocol_test"
filelist = "rob/filelist.f"
timeout_ns = 300000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
functional_groups = ["rob_pkg::model::behavior"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

[[tests]]
