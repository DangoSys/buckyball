[model]
manifest = "src/csrc/Cargo.toml"
library = "libfetch_reference_model"

[[tests]]
functional_groups = ["fetch_pkg::model::behavior"]
name = "fetch"
top = "fetch_tb"
test = "protocol_test"
filelist = "filelist.f"
timeout_ns = 200000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

[[tests]]
functional_groups = []
name = "fetch_bad_ack"
top = "fetch_tb"
test = "invalid_test"
filelist = "filelist.f"
timeout_ns = 200000
wall_timeout_s = 120
kind = "assertion"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = ["+CASE=ack"]
assertion = "Fetch maintenance response must acknowledge completion"

