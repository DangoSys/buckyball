[model]
manifest="src/csrc/Cargo.toml"
library="libpreflight_reference"

[[tests]]
functional_groups = ["preflight_pkg::env::behavior"]
name = "preflight"
top = "preflight_tb"
test = "protocol_test"
filelist = "preflight/filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

