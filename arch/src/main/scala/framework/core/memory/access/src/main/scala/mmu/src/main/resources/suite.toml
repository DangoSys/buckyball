[model]
manifest = "src/csrc/Cargo.toml"
library = "libmmu_reference_model"

[[tests]]
functional_groups = ["mmu_pkg::model::behavior"]
name = "walker"
top = "walker_tb"
test = "protocol_test"
filelist = "filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

[[tests]]
functional_groups = []
name = "walker_bad_access"
top = "walker_tb"
test = "invalid_test"
filelist = "filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "assertion"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = ["+CASE=access"]
assertion = "Walker access cannot both write and execute"

[[tests]]
functional_groups = []
name = "walker_bad_mode"
top = "walker_tb"
test = "invalid_test"
filelist = "filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "assertion"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = ["+CASE=mode"]
assertion = "Walker requires Bare or Sv39 mode"

[[tests]]
functional_groups = []
name = "walker_bad_privilege"
top = "walker_tb"
test = "invalid_test"
filelist = "filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "assertion"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = ["+CASE=privilege"]
assertion = "Walker effective privilege must be U, S or M"
