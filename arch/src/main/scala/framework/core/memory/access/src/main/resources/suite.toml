[model]
manifest="src/csrc/Cargo.toml"
library="libmem_access_reference_model"

[[tests]]
name="virtual_access"
top="virtual_access_tb"
test="protocol_test"
filelist="virtual/filelist.f"
timeout_ns=500000
wall_timeout_s=120
kind="functional"
rtl_scopes=["dut"]
metrics=["line","cond","tgl"]
functional_groups=["virtual_pkg::model::behavior"]
sink_ready=1
sink_stall=3
designs=[]
plusargs=[]
assertion=""

[[tests]]
functional_groups = ["mem_access_pkg::env::behavior"]
name = "mem_access"
top = "mem_access_tb"
test = "protocol_test"
filelist = "physical/mem_access.f"
timeout_ns = 200000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

