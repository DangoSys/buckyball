[model]
manifest = "src/csrc/Cargo.toml"
library = "libant_ref"

[[tests]]
functional_groups = []
name = "ant"
top = "ant_tb"
test = "protocol_test"
filelist = "ant.f"
timeout_ns = 100000000
wall_timeout_s = 3600
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

