[model]
manifest = "src/csrc/Cargo.toml"
library = "libchi_reference_model"

[[tests]]
functional_groups = ["chi_retry_pkg::protocol_model::behavior"]
name = "retry"
top = "retry_tb"
test = "protocol_test"
filelist = "retry/filelist.f"
timeout_ns = 450000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = ["+CASE=normal"]
assertion = ""

[[tests]]
functional_groups = []
name = "retry_bad_opcode"
