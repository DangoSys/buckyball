[model]
manifest = "../../../../../../../verify/uvm/src/protocol/interlock/model/Cargo.toml"
library = "libinterlock_reference"

[[tests]]
functional_groups = ["interlock_pkg::ownership_model::activity", "interlock_pkg::ownership_model::maintenance_kind", "interlock_pkg::ownership_model::probes"]
name = "interlock"
top = "interlock_tb"
test = "protocol_test"
filelist = "filelist.f"
timeout_ns = 500000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

