[model]
manifest="src/csrc/Cargo.toml"
library="libddr_reference"

[[tests]]
functional_groups = ["ddr_pkg::env::behavior"]
name = "bridge"
top = "bridge_tb"
test = "protocol_test"
filelist = "filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "functional"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = []
assertion = ""

[[tests]]
functional_groups = []
name = "bad_alignment"
top = "bridge_tb"
test = "protocol_test"
filelist = "filelist.f"
timeout_ns = 1000000
wall_timeout_s = 120
kind = "assertion"
rtl_scopes = ["dut"]
metrics = ["line", "cond", "tgl"]
sink_ready = 1
sink_stall = 3
designs = []
plusargs = ["+invalid_case=0"]
assertion = "DDR line request must be 64 byte aligned"

