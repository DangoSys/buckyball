[modules.frontend]
level = "domain"
path = "arch/src/main/scala/framework/acc/frontend"

[modules.frontend.build]
directory = "arch/src/main/scala/framework"
module = "acc.frontend"
arguments = ["--config", "{repo}/examples/designs/{design}/output/sims/device/generated/design.pb"]

[modules.memdomain]
level = "domain"
path = "arch/src/main/scala/framework/acc/memdomain"

[modules.memdomain.build]
directory = "arch/src/main/scala/framework"
module = "acc.memdomain"
arguments = ["--design", "{design}"]

[modules.gpdomain]
level = "domain"
path = "arch/src/main/scala/framework/acc/gpdomain"

[modules.gpdomain.build]
directory = "arch/src/main/scala/framework"
module = "acc.gpdomain"
arguments = ["--config", "{repo}/examples/designs/{design}/output/sims/device/generated/design.pb"]

[modules.balldomain]
level = "domain"
path = "arch/src/main/scala/framework/acc/balldomain"

[modules.balldomain.build]
runtime = [{ directory = "examples", module = "library" }]
directory = "arch/src/main/scala/framework"
module = "acc.balldomain"
arguments = ["--config", "{repo}/examples/designs/{design}/output/sims/device/generated/design.pb"]

[modules.ant]
level = "thread"
path = "arch/src/main/scala/framework/thread/ant"

[modules.ant.build]
directory = "arch/src/main/scala/framework"
module = "thread.ant"
arguments = ["--config", "{repo}/examples/designs/{design}/output/sims/device/generated/design.pb", "--core", "1"]

